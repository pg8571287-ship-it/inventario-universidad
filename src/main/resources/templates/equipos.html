<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Equipos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="mb-4">
        Equipos Disponibles
    </h1>

    <div class="row">

        <div class="col-md-4 mb-4"
             th:each="equipo : ${equipos}">

            <div class="card shadow-lg border-0">

                <div class="card-body">

                    <h4 th:text="${equipo.nombre}"></h4>

                    <p>

                        Marca:

                        <span th:text="${equipo.marca}"></span>

                    </p>

                    <p>

                        Estado:

                        <span class="badge bg-success">

                            Disponible

                        </span>

                    </p>

                    <form th:action="@{/reservar/{id}(id=${equipo.id})}"
                          method="post">

                        <button class="btn btn-primary w-100">

                            Reservar Equipo

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
