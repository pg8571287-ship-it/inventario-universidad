<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>

        Editar Usuario

    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2 class="mb-4">

            Editar Usuario

        </h2>

        <form th:action="@{/admin/usuarios/actualizar}"
              method="post">

            <!-- ID -->

            <input type="hidden"
                   name="id"
                   th:value="${usuario.id}">

            <!-- IDENTIFICACION -->

            <div class="mb-3">

                <label>

                    Identificación

                </label>

                <input type="text"
                       name="identificacion"
                       class="form-control"
                       th:value="${usuario.identificacion}">
            </div>

            <!-- NOMBRE -->

            <div class="mb-3">

                <label>

                    Nombre

                </label>

                <input type="text"
                       name="nombre"
                       class="form-control"
                       th:value="${usuario.nombre}">
            </div>

            <!-- CORREO -->

            <div class="mb-3">

                <label>

                    Correo

                </label>

                <input type="email"
                       name="correo"
                       class="form-control"
                       th:value="${usuario.correo}">
            </div>

            <!-- ROL -->

            <div class="mb-3">

                <label>

                    Rol

                </label>

                <select name="rol"
                        class="form-select">

                    <option value="ADMIN"
                            th:selected="${usuario.rol == 'ADMIN'}">

                        ADMIN

                    </option>

                    <option value="USUARIO"
                            th:selected="${usuario.rol == 'USUARIO'}">

                        USUARIO

                    </option>

                </select>

            </div>

            <!-- BOTON -->

            <button type="submit"
                    class="btn btn-primary">

                Actualizar Usuario

            </button>

        </form>

    </div>

</div>

</body>

</html>
