<!DOCTYPE html>

<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro</title>

    <!-- BOOTSTRAP -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6 mt-5">

            <div class="card shadow p-4">

                <h2 class="text-center mb-4">

                    Registro de Usuario

                </h2>

                <!-- ERROR -->

                <div th:if="${error}"
                     class="alert alert-danger">

                    <span th:text="${error}"></span>

                </div>

                <!-- FORMULARIO -->

                <form th:action="@{/guardar-usuario}"

                      th:object="${usuario}"

                      method="post">

                    <!-- IDENTIFICACION -->

                    <div class="mb-3">

                        <label>

                            Número de identificación

                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{identificacion}"
                               required>

                    </div>

                    <!-- NOMBRE -->

                    <div class="mb-3">

                        <label>

                            Nombre completo

                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{nombre}"
                               required>

                    </div>

                    <!-- CORREO -->

                    <div class="mb-3">

                        <label>

                            Correo institucional

                        </label>

                        <input type="email"
                               class="form-control"
                               th:field="*{correo}"
                               required>

                    </div>

                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label>

                            Contraseña

                        </label>

                        <input type="password"
                               class="form-control"
                               th:field="*{password}"
                               required>

                    </div>

                    <!-- BOTON -->

                    <button class="btn btn-primary w-100">

                        Registrarse

                    </button>

                </form>

                <!-- LOGIN -->

                <div class="text-center mt-3">

                    <a href="/login">

                        ¿Ya tienes cuenta? Inicia sesión

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
